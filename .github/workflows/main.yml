name: Compilar APK                                     │
│      on:                                                    │
│        push:                                                │
│          branches: [ "main" ]                               │
│        workflow_dispatch:                                   │
│      permissions:                                           │
│        contents: read                                       │
│      jobs:                                                  │
│        build:                                               │
│          runs-on: ubuntu-latest                             │
│          steps:                                             │
│          - uses: actions/checkout@v4                        │
│          - name: Descomprimir                               │
│            run: unzip -q MiBalance-actualizado.zip          │
│          - uses: actions/setup-java@v4                      │
│            with:                                            │
│              distribution: 'temurin'                        │
│              java-version: '17'                             │
│          - uses: gradle/actions/setup-gradle@v4             │
│            with:                                            │
│              gradle-version: '8.5'                          │
│          - name: Compilar                                   │
│            run: |                                           │
│              cd MiBalance                                   │
│              gradle assembleDebug --stacktrace              │
│          - uses: actions/upload-artifact@v4                 │
│            if: always()                                     │
│            with:                                            │
│              name: MiBalance-APK                            │
│              path: "**/build/outputs/apk/**/*.apk"  
